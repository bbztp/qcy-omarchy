name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      # TODO: pin actions to full commit SHAs (look them up on each action's releases page).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check tag, manifest and changelog agree
        id: meta
        run: |
          version="$(python3 -I -c 'import json;print(json.load(open("manifest.json"))["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v${version} (manifest.json)"; exit 1
          fi
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md"; then
            echo "CHANGELOG.md has no section for [${version}]"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: go test -count=1 ./...
      - name: Package
        run: |
          for arch in amd64 arm64; do
            bash scripts/package-release.sh "${{ steps.meta.outputs.version }}" "$arch" dist
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
