name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Dry run: builds and compares against the committed SHA256SUMS, never
  # attests or publishes (use it before tagging: gh workflow run release.yml --ref main).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check tag, manifest and changelog agree
        id: meta
        run: |
          version="$(python3 -I -c 'import json;print(json.load(open("manifest.json"))["version"])')"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v${version} (manifest.json)"; exit 1
          fi
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          if ! grep -q '[^[:space:]]' "${RUNNER_TEMP}/notes.md"; then
            echo "CHANGELOG.md has no section for [${version}]"; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: go test -count=1 ./...
      - name: Package
        run: |
          go version
          for arch in amd64 arm64; do
            bash scripts/package-release.sh "${{ steps.meta.outputs.version }}" "$arch" dist
          done
      - name: Binaries must match the committed SHA256SUMS exactly
        # Same command and glob order as scripts/release-sums.sh. A mismatch means
        # the source or the toolchain differs from the one the sums were made on:
        # nothing is attested or published.
        run: |
          ( cd dist && sha256sum *.tar.gz ) > "${RUNNER_TEMP}/built.sums"
          cat "${RUNNER_TEMP}/built.sums"
          diff "${RUNNER_TEMP}/built.sums" SHA256SUMS
      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        # Draft first with every asset, public last: with immutable releases the
        # assets are locked at publication, so nothing may fail after that step.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz SHA256SUMS \
            --draft --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md" --verify-tag
          gh release edit "${GITHUB_REF_NAME}" --draft=false
