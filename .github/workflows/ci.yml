name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # TODO: pin actions to full commit SHAs (look them up on each action's releases page).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Static build (no CGO needed)
        run: CGO_ENABLED=0 go build ./cmd/...
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go test
        # Tests never touch hardware: each package's TestMain disables BLE and
        # redirects HOME/XDG_* to a throwaway tree. No variables are required.
        run: go test -count=1 ./...
      - name: Shell scripts
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          bash scripts/bootstrap_test.sh
      - name: Pinned release checksums
        # SHA256SUMS (committed, verified by scripts/bootstrap.sh) must name exactly
        # the two tarballs of the manifest version. The hashes are checked by the
        # release workflow, which rebuilds the binaries.
        run: |
          python3 -I - <<'PY'
          import json, re, sys
          v = json.load(open("manifest.json"))["version"]
          want = [f"qcy-omarchy_{v}_linux_{a}.tar.gz" for a in ("amd64", "arm64")]
          try:
              lines = open("SHA256SUMS").read().splitlines()
          except OSError as e:
              sys.exit(f"SHA256SUMS missing: {e}")
          got = []
          for l in lines:
              m = re.fullmatch(r"([0-9a-f]{64})  (\S+)", l)
              if not m:
                  sys.exit(f"bad SHA256SUMS line: {l!r}")
              got.append(m.group(2))
          if got != want:
              sys.exit(f"SHA256SUMS names {got}, expected {want}; run scripts/release-sums.sh")
          print("SHA256SUMS ok for", v)
          PY
      - name: Manifest
        run: |
          python3 -I - <<'PY'
          import json, re, sys
          m = json.load(open("manifest.json"))
          v = m.get("version", "")
          if not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?", v):
              sys.exit(f"manifest version is not semver: {v!r}")
          print("manifest ok, version", v)
          PY
