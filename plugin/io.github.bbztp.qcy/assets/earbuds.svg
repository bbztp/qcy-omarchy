<?xml version="1.0" encoding="UTF-8"?>
<!--
  QCY MeloBuds N70, drawn to match the real hardware.

  The shape is not a stem earbud: it is a glossy rounded blob with a flat
  tapered titanium blade laid across it diagonally, three small control buttons
  near the blade's lower end, and a silicone tip protruding from the inner side.
  Earlier versions drew an AirPods-style stem with an exposed driver, which is
  the wrong product entirely.

  Drawn here rather than using QCY's product photography: the photos are
  copyrighted marketing assets and carry backgrounds that would not sit on a
  translucent panel. This is a redrawn reference, tinted with the same greys as
  the Titanium colourway.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 132" width="200" height="132">
  <defs>
    <!-- Glossy black shell. -->
    <radialGradient id="shell" cx="0.36" cy="0.3" r="0.82">
      <stop offset="0" stop-color="#5c6068"/>
      <stop offset="0.28" stop-color="#33363c"/>
      <stop offset="0.68" stop-color="#1a1c20"/>
      <stop offset="1" stop-color="#0c0d0f"/>
    </radialGradient>

    <!-- Brushed titanium blade. -->
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0.15">
      <stop offset="0" stop-color="#6e747e"/>
      <stop offset="0.18" stop-color="#cfd4dc"/>
      <stop offset="0.45" stop-color="#9aa0aa"/>
      <stop offset="0.8" stop-color="#5a6069"/>
      <stop offset="1" stop-color="#3b4048"/>
    </linearGradient>

    <!-- Matte silicone tip. -->
    <linearGradient id="tip" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#43474e"/>
      <stop offset="0.5" stop-color="#282b30"/>
      <stop offset="1" stop-color="#111316"/>
    </linearGradient>

    <linearGradient id="gloss" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- One earbud, tip pointing left. -->
    <g id="bud">
      <!-- Silicone tip, behind the shell. -->
      <g transform="translate(-24,-1) rotate(-14)">
        <path d="M0,0 C9,-8 13,-19 9,-27 C5,-34 -5,-34 -9,-27 C-13,-19 -9,-8 0,0 Z"
              fill="url(#tip)"/>
        <ellipse cx="-1" cy="-26" rx="6.5" ry="3" fill="#08090b" opacity="0.75"/>
      </g>

      <!-- Glossy shell. -->
      <ellipse cx="0" cy="0" rx="28" ry="29" fill="url(#shell)"/>

      <!-- Specular highlight on the shell. -->
      <ellipse cx="-9" cy="-12" rx="13" ry="9" fill="url(#gloss)"
               transform="rotate(-24 -9 -12)"/>

      <!-- Titanium blade, laid across the shell diagonally. -->
      <g transform="rotate(-16)">
        <rect x="-8" y="-26" width="16" height="66" rx="8" fill="url(#blade)"/>
        <!-- Blade edge, so it reads as a flat part and not a rod. -->
        <rect x="-8" y="-26" width="3" height="66" rx="1.5"
              fill="#ffffff" opacity="0.22"/>
        <rect x="4" y="-26" width="2.2" height="66" rx="1.1"
              fill="#000000" opacity="0.24"/>
        <!-- Three control buttons near the lower end. -->
        <circle cx="0" cy="14" r="3" fill="#22262b" opacity="0.85"/>
        <circle cx="0" cy="23" r="3" fill="#22262b" opacity="0.85"/>
        <circle cx="0" cy="32" r="3" fill="#22262b" opacity="0.85"/>
      </g>
    </g>
  </defs>

  <g id="artwork">
    <!-- Far ear first so the near one overlaps it. -->
    <g transform="translate(140,58) rotate(9) scale(0.92)">
      <use href="#bud"/>
    </g>
    <g transform="translate(62,60) rotate(-7)">
      <use href="#bud"/>
    </g>
  </g>
</svg>